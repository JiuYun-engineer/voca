<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어 암기장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어 암기장">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e4e7ec; --text:#1b1f24; --muted:#6b7280;
    --accent:#3b5bdb; --accent-soft:#e8ecff; --ok:#0f9d58; --ok-soft:#e3f5ec;
    --bad:#d92d20; --bad-soft:#fdeceb; --warn:#b7791f; --warn-soft:#fdf3e0;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --panel:#1c1f24; --line:#2c3038; --text:#e8eaed; --muted:#9aa1ac;
      --accent:#7c93ff; --accent-soft:#232a45; --ok:#4ade80; --ok-soft:#17321f;
      --bad:#f87171; --bad-soft:#3a1d1d; --warn:#fbbf24; --warn-soft:#39301a;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.5;overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
  h1,h2,h3{margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}

  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top)}
  .head-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:17px;letter-spacing:-.02em}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
  nav button:hover{background:var(--bg)}
  nav button.on{background:var(--accent-soft);color:var(--accent)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:16px}
  .panel h2{font-size:15px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:120px}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);outline:none;
    font-size:16px}/* 16px: iOS에서 입력할 때 화면이 확대되는 것 방지 */
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--panel)}
  textarea{resize:vertical;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .btn{padding:9px 14px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.9;color:#fff}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
  .btn.ghost:hover{background:var(--bg)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}

  /* 범위 칩 */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip .n{opacity:.65;font-weight:500;margin-left:4px}

  /* 관리 화면 */
  .cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
  .cols>*{min-width:0}/* 표가 칼럼을 밀어내서 가로 스크롤 생기는 것 방지 */
  @media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
  .rlist{display:flex;flex-direction:column;gap:4px}
  .ritem{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .ritem:hover{background:var(--bg)}
  .ritem.on{background:var(--accent-soft);color:var(--accent)}
  .ritem .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.w{font-weight:700;white-space:nowrap}
  .tools{display:flex;gap:2px;justify-content:flex-end}

  /* 암기 카드 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
  .card .top{display:flex;align-items:baseline;gap:8px}
  .card .wd{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .card .rg{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .fld{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;position:relative;min-height:38px}
  .fld:hover{border-color:var(--accent)}
  .fld .lb{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .fld .vl{margin-top:2px;word-break:break-word}
  .fld.ko .vl{color:var(--text)}
  .fld.syn .vl{color:var(--accent);font-weight:600}
  .fld.mn{background:var(--warn-soft)}
  .fld.mn .vl{color:var(--warn);font-size:13.5px}
  .fld.hid .vl{filter:blur(7px);opacity:.55;user-select:none}
  .fld.hid::after{content:"눌러서 확인";position:absolute;inset:auto 10px 8px auto;font-size:11px;color:var(--muted);font-weight:600}
  .fld.empty-f{opacity:.5}
  .fld .edit{position:absolute;top:4px;right:4px;padding:4px 8px;border:0;background:none;color:var(--muted);
    border-radius:7px;cursor:pointer;font-size:13px}
  .fld .edit:active{background:var(--bg)}
  .starred{border-color:var(--warn)!important}
  .star{padding:4px 6px;font-size:16px;line-height:1;background:none;border:0;cursor:pointer;border-radius:8px}

  /* 시험 */
  .quiz{max-width:640px;margin:0 auto}
  .qbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 18px}
  .qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .qword{font-size:34px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:8px 0 4px;word-break:break-word}
  .qhint{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;text-align:left;font-size:16px;font-weight:600}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt .k{width:22px;height:22px;flex:none;border-radius:6px;background:var(--bg);color:var(--muted);font-size:12px;display:grid;place-items:center;font-weight:700}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px}
  .fb.ok{background:var(--ok-soft);color:var(--ok)}
  .fb.no{background:var(--bad-soft);color:var(--bad)}
  .score{font-size:44px;font-weight:800;text-align:center}
  .stat{display:flex;gap:10px;justify-content:center;margin:14px 0 20px;flex-wrap:wrap}
  .stat div{background:var(--bg);border-radius:10px;padding:10px 18px;text-align:center;min-width:88px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--muted)}
  .wrongitem{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .wrongitem b{min-width:110px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
  .kbd{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
  .hide{display:none!important}

  /* ---- 모바일 ---- */
  @media(max-width:640px){
    .wrap{padding-left:12px;padding-right:12px}
    .head-in{padding:8px 12px;gap:8px}
    .logo{font-size:15px}
    nav{width:100%;margin-left:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    nav button{padding:9px 4px;font-size:14px;text-align:center}
    .panel{padding:14px 12px;margin-top:12px;border-radius:14px}
    .cards{grid-template-columns:1fr;gap:10px}
    .btn{padding:10px 14px}
    .btn.sm{padding:7px 11px}
    .chip{padding:9px 14px}
    .fld{padding:10px 12px;min-height:46px}
    .qword{font-size:28px}
    .opt{padding:15px 14px;font-size:17px}
    .quiz .kbd{display:none}
    .stat div{padding:9px 14px;min-width:76px}
    .wrongitem{flex-wrap:wrap;gap:4px 10px}
    .wrongitem b{min-width:0;width:100%}
    #testRun .panel{position:relative}
  }
  @media(hover:none){ .fld.hid::after{content:"탭해서 확인"} }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo">📖 단어 암기장</div>
    <nav>
      <button data-tab="manage">단어 입력</button>
      <button data-tab="study" class="on">단어 암기</button>
      <button data-tab="test">단어 시험</button>
    </nav>
  </div>
</header>

<div class="wrap">

<!-- ================= 단어 입력 ================= -->
<section id="tab-manage" class="hide">
  <div class="cols">
    <div class="panel">
      <h2>범위</h2>
      <div class="row" style="margin-bottom:10px">
        <input type="text" id="newRange" class="grow" placeholder="예: Day 1 / 1~100">
        <button class="btn primary sm" id="addRange">추가</button>
      </div>
      <div class="rlist" id="rangeList"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <div class="row">
        <button class="btn sm" id="exportBtn">파일로 내보내기</button>
        <button class="btn sm" id="importBtn">파일 불러오기</button>
        <input type="file" id="importFile" accept="application/json" class="hide">
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" id="copyBtn">📋 텍스트로 복사</button>
        <button class="btn sm" id="pasteBtn">📥 붙여넣어 복원</button>
      </div>
      <p class="small muted" style="margin:8px 0 0">데이터는 기기별로 저장됩니다. PC ↔ 폰 옮길 때는 <b>텍스트로 복사</b> → 카톡/메모로 보낸 뒤 다른 기기에서 <b>붙여넣어 복원</b>하세요.</p>
    </div>

    <div>
      <div class="panel">
        <h2 id="curRangeTitle">단어 추가</h2>
        <div class="row" style="margin-bottom:8px">
          <div class="grow"><label class="f">단어</label><input type="text" id="fWord" placeholder="abandon"></div>
          <div class="grow"><label class="f">한국어 뜻</label><input type="text" id="fKo" placeholder="버리다, 포기하다"></div>
        </div>
        <div class="row" style="margin-bottom:8px">
          <div class="grow"><label class="f">영어 동의어 (쉼표로 구분)</label><input type="text" id="fSyn" placeholder="desert, forsake, relinquish"></div>
          <div class="grow"><label class="f">연상법 (선택)</label><input type="text" id="fMn" placeholder="어! 밴드 던져 → 버리다"></div>
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn ghost sm" id="cancelEdit" style="display:none">취소</button>
          <button class="btn primary" id="saveWord">추가하기</button>
        </div>
      </div>

      <div class="panel">
        <h2>여러 개 한 번에 붙여넣기</h2>
        <p class="small muted" style="margin:-6px 0 8px">한 줄에 한 단어씩 · <code>단어 | 한국어뜻 | 동의어1, 동의어2 | 연상법</code> (탭 구분도 가능)</p>
        <textarea id="bulkText" placeholder="abandon | 버리다, 포기하다 | desert, forsake | 어! 밴드 던져
abate | 줄어들다 | diminish, subside, wane"></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <button class="btn primary" id="bulkAdd">한 번에 추가</button>
        </div>
      </div>

      <div class="panel">
        <h2>단어 목록 <span class="muted small" id="wordCount"></span></h2>
        <div id="wordTable"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= 단어 암기 ================= -->
<section id="tab-study">
  <div class="panel">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">범위 선택</h2>
      <button class="btn ghost sm" id="studyAll">전체</button>
      <button class="btn ghost sm" id="studyNone">해제</button>
      <div class="grow"></div>
      <input type="text" id="studySearch" placeholder="단어 검색…" style="max-width:200px">
    </div>
    <div class="chips" id="studyChips"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <div class="row">
      <span class="small muted">가리기:</span>
      <button class="btn sm" data-mask="ko">뜻 전부</button>
      <button class="btn sm" data-mask="syn">동의어 전부</button>
      <button class="btn sm" data-mask="mn">연상법 전부</button>
      <button class="btn sm" data-mask="all">전부 가리기</button>
      <button class="btn sm" data-mask="none">전부 펼치기</button>
      <div class="grow"></div>
      <label class="small muted" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="onlyStar" style="width:auto"> ⭐ 다시 볼 단어만
      </label>
      <button class="btn sm" id="shuffleCards">🔀 섞기</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="empty hide" id="studyEmpty">표시할 단어가 없습니다. <b>단어 입력</b> 탭에서 범위와 단어를 먼저 만들어 주세요.</div>
</section>

<!-- ================= 단어 시험 ================= -->
<section id="tab-test" class="hide">
  <!-- 설정 -->
  <div id="testSetup">
    <div class="panel">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0">시험 범위</h2>
        <button class="btn ghost sm" id="testAll">전체</button>
        <button class="btn ghost sm" id="testNone">해제</button>
      </div>
      <div class="chips" id="testChips"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <div class="row">
        <div style="min-width:190px"><label class="f">문제 유형</label>
          <select id="qType">
            <option value="syn">단어 → 영어 동의어 (기본)</option>
            <option value="ko">단어 → 한국어 뜻</option>
            <option value="synrev">영어 동의어 → 단어</option>
            <option value="mix">섞어서 출제</option>
          </select>
        </div>
        <div style="min-width:150px"><label class="f">문항 수</label>
          <select id="qCount"><option value="0">전범위 (전부)</option><option>10</option><option>20</option><option>30</option><option>50</option></select>
        </div>
        <div style="min-width:150px"><label class="f">출제 대상</label>
          <select id="qScope"><option value="all">선택 범위 전체</option><option value="star">⭐ 다시 볼 단어만</option></select>
        </div>
        <div style="align-self:flex-end;margin-left:auto"><button class="btn primary" id="startTest">시험 시작</button></div>
      </div>
      <p class="small muted" style="margin:10px 0 0" id="setupInfo"></p>
    </div>

    <div class="panel">
      <div class="row"><h2 style="margin:0">⭐ 다시 볼 단어 <span class="muted small" id="starCount"></span></h2>
        <div class="grow"></div>
        <button class="btn sm danger" id="clearStars">전체 비우기</button>
      </div>
      <div id="starList"></div>
    </div>
  </div>

  <!-- 진행 -->
  <div id="testRun" class="hide">
    <div class="panel quiz">
      <div class="row small muted"><span id="qProgress"></span><div class="grow"></div><span id="qScoreLive"></span>
        <button class="btn ghost sm" id="quitTest">그만두기</button></div>
      <div class="qbar"><i id="qbar" style="width:0"></i></div>
      <div class="qword" id="qWord"></div>
      <div class="qhint" id="qHint"></div>
      <div class="opts" id="qOpts"></div>
      <div id="qFb"></div>
      <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary hide" id="nextQ">다음 →</button></div>
      <div class="kbd">키보드 1·2·3·4 로 선택, Enter 로 다음</div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="testResult" class="hide">
    <div class="panel quiz">
      <h2 style="text-align:center;color:var(--muted);font-weight:600">시험 결과</h2>
      <div class="score" id="rScore"></div>
      <div class="stat" id="rStat"></div>
      <div id="rWrong"></div>
      <div class="row" style="justify-content:center;margin-top:20px">
        <button class="btn" id="againSame">같은 범위 다시</button>
        <button class="btn primary" id="againWrong">틀린 단어만 다시</button>
        <button class="btn ghost" id="backSetup">설정으로</button>
      </div>
    </div>
  </div>
</section>

</div>

<script>
/* ---------------- 저장소 ---------------- */
const KEY='vocab-app-v1';
let db = load();
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.ranges)) return {ranges:d.ranges, stars:d.stars||{}};
  }catch(e){}
  return {ranges:[], stars:{}};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function allWords(){ return db.ranges.flatMap(r=>r.words.map(w=>({...w,_r:r.name,_rid:r.id}))); }
function findWord(id){ for(const r of db.ranges){const w=r.words.find(x=>x.id===id); if(w) return {...w,_r:r.name,_rid:r.id};} return null; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------------- 탭 ---------------- */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['manage','study','test'].forEach(t=>$('#tab-'+t).classList.toggle('hide',t!==b.dataset.tab));
  if(b.dataset.tab==='study') renderStudy();
  if(b.dataset.tab==='test') renderTestSetup();
  if(b.dataset.tab==='manage') renderManage();
  window.scrollTo(0,0);
});

/* ---------------- 단어 입력 ---------------- */

/* 문제 생성: type = syn | ko | synrev */
function buildQ(w, type, all){
  const synOf=x=>(x.syn||[]).filter(Boolean);
  if(type==='syn' && !synOf(w).length) type='ko';
  if(type==='synrev' && !synOf(w).length) type='ko';
  if(type==='ko' && !w.ko) { if(synOf(w).length) type='syn'; else return null; }

  let prompt_, hint, correct, getter;
  if(type==='syn'){ prompt_=w.word; hint='알맞은 영어 동의어를 고르세요';
    getter=x=>synOf(x)[0]; correct=synOf(w)[Math.random()*synOf(w).length|0]; }
  else if(type==='ko'){ prompt_=w.word; hint='알맞은 한국어 뜻을 고르세요';
    getter=x=>x.ko; correct=w.ko; }
  else { prompt_=synOf(w)[Math.random()*synOf(w).length|0]; hint='이 단어와 같은 뜻의 단어를 고르세요';
    getter=x=>x.word; correct=w.word; }

  const seen=new Set([String(correct).toLowerCase(), String(prompt_).toLowerCase()]);
  const distract=[];
  for(const x of shuffle(all)){
    if(x.id===w.id) continue;
    const v=getter(x); if(!v) continue;
    const k=String(v).toLowerCase(); if(seen.has(k)) continue;
    seen.add(k); distract.push(v);
    if(distract.length===3) break;
  }
  if(distract.length<3) return null;
  return {wid:w.id, word:w.word, type, prompt:prompt_, hint, correct,
    opts:shuffle([correct,...distract]), ko:w.ko, syn:synOf(w), mn:w.mn, range:w._r};
}
function makeQuiz(words, typeSel, count){
  const all=allWords();
  let qs=[];
  for(const w of shuffle(words)){
    const t = typeSel==='mix' ? ['syn','ko','synrev'][Math.random()*3|0] : typeSel;
    const q = buildQ(w,t,all) || buildQ(w,'ko',all) || buildQ(w,'syn',all);
    if(q) qs.push(q);
  }
  if(count>0) qs=qs.slice(0,count);
  return qs;
}

function startQuiz(qs){
  if(!qs.length){ alert('문제를 만들 수 없습니다. 뜻이나 동의어를 더 입력해 주세요.'); return; }
  quiz=qs; qi=0; answers=[];
  $('#testSetup').classList.add('hide'); $('#testResult').classList.add('hide'); $('#testRun').classList.remove('hide');
  showQ(); window.scrollTo(0,0);
}
function showQ(){
  const q=quiz[qi];
  $('#qProgress').textContent=`${qi+1} / ${quiz.length}`;
  const right=answers.filter(a=>a.ok).length;
  $('#qScoreLive').textContent=answers.length?`✔ ${right}  ✘ ${answers.length-right}`:'';
  $('#qbar').style.width=(qi/quiz.length*100)+'%';
  $('#qWord').textContent=q.prompt;
  $('#qHint').textContent=q.hint;
  $('#qFb').innerHTML=''; $('#nextQ').classList.add('hide');
  $('#qOpts').innerHTML=q.opts.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('');
  $$('#qOpts .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function pick(i){
  const q=quiz[qi], chosen=q.opts[i], ok=chosen===q.correct;
  answers.push({wid:q.wid, ok, chosen, q});
  if(!ok){ db.stars[q.wid]=1; save(); }
  $$('#qOpts .opt').forEach((b,idx)=>{
    b.disabled=true;
    if(q.opts[idx]===q.correct) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  const extra=[q.ko&&`뜻: ${esc(q.ko)}`, q.syn.length&&`동의어: ${esc(q.syn.join(', '))}`, q.mn&&`연상법: ${esc(q.mn)}`]
    .filter(Boolean).join(' &nbsp;·&nbsp; ');
  $('#qFb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'정답! ':'오답 — 정답은 <b>'+esc(q.correct)+'</b> · ⭐ 다시 볼 단어에 추가됨<br>'}
    <span style="opacity:.85">${esc(q.word)} — ${extra}</span></div>`;
  $('#nextQ').classList.remove('hide'); $('#nextQ').focus();
}
$('#nextQ').onclick=()=>{ qi++; qi<quiz.length? showQ(): finish(); };
document.addEventListener('keydown',e=>{
  if($('#testRun').classList.contains('hide')) return;
  if(['1','2','3','4'].includes(e.key)){ const b=$(`#qOpts .opt[data-i="${+e.key-1}"]`); if(b&&!b.disabled) b.click(); }
  if(e.key==='Enter'&&!$('#nextQ').classList.contains('hide')) $('#nextQ').click();
});
function finish(){
  $('#testRun').classList.add('hide'); $('#testResult').classList.remove('hide'); window.scrollTo(0,0);
  const right=answers.filter(a=>a.ok).length, total=answers.length, pct=Math.round(right/total*100);
  $('#rScore').innerHTML=`${pct}<span style="font-size:20px">점</span>`;
  $('#rScore').style.color = pct>=90?'var(--ok)':pct>=70?'var(--accent)':'var(--bad)';
  $('#rStat').innerHTML=`<div><b>${total}</b><span>문항</span></div>
    <div><b style="color:var(--ok)">${right}</b><span>정답</span></div>
    <div><b style="color:var(--bad)">${total-right}</b><span>오답</span></div>`;
  const wrong=answers.filter(a=>!a.ok);
  $('#rWrong').innerHTML = wrong.length? `<h2 style="margin:20px 0 6px">틀린 단어 <span class="badge">${wrong.length}</span> <span class="small muted">— ⭐ 다시 볼 단어에 저장했습니다</span></h2>`
    + wrong.map(a=>`<div class="wrongitem"><b>${esc(a.q.word)}</b>
        <span class="muted">${esc(a.q.ko)}</span>
        <span style="color:var(--accent)">${esc(a.q.syn.join(', '))}</span>
        <div class="grow"></div><span class="small" style="color:var(--bad)">내 답: ${esc(a.chosen)}</span></div>`).join('')
    : '<p class="empty" style="color:var(--ok)">전부 정답입니다! 🎉</p>';
}
